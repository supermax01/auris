# ---------------------------------------------------------------------------
# Speech-to-text, laptop profile (PLAN section 6 / A6).
# Source is OpenAI's original; Auris converts it to CTranslate2 INT8
# itself in a later step (conversion command + converted artefacts get
# pinned there). Revision and licence from the Hugging Face API:
#   https://huggingface.co/api/models/openai/whisper-large-v3-turbo
# (field `sha`; `cardData.license` = "mit"), read 2026-11-12.
# ---------------------------------------------------------------------------

[asr.laptop]
source_model = "openai/whisper-large-v3-turbo"
revision = "41f01f3fe87f28c78e2fbf8b568835947dd65ed9"
license = "MIT"

# ---------------------------------------------------------------------------
# Fact-extraction model (PLAN A5/A6). Metadata only — no weights are
# downloaded in Step 1. Revision is field `sha` and the file digest is
# `siblings[].lfs.sha256` for the Q4_K_M file, from:
#   https://huggingface.co/api/models/Qwen/Qwen3-8B-GGUF?blobs=true
# read 2026-11-12. `cardData.license` = "apache-2.0".
# Temperature 0 is the candidate value to confirm in Slice 1 (PLAN A5).
# ---------------------------------------------------------------------------

[extractor]
model = "Qwen/Qwen3-8B-GGUF"
revision = "7c41481f57cb95916b40956ab2f0b139b296d974"
gguf_filename = "Qwen3-8B-Q4_K_M.gguf"
gguf_sha256 = "d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785"
license = "Apache-2.0"
n_ctx = 8192
max_output_tokens = 4096
min_output_tokens = 1024
thinking = false
temperature = 0.0
temperature_status = "candidate, confirm in Slice 1"

# Each call reserves measured input + 256 headroom, up to the output ceiling.
# Windows shrink below the output floor. Truncated output is discarded before
# deterministic splitting; a truncated single segment fails the entire run.
[[extractor.candidates]]
id = "qwen3-8b-q4_k_m"
repo = "Qwen/Qwen3-8B-GGUF"
revision = "7c41481f57cb95916b40956ab2f0b139b296d974"
gguf_filename = "Qwen3-8B-Q4_K_M.gguf"
sha256 = "d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785"
license = "Apache-2.0"
quantization = "Q4_K_M"
runtime_flags = ["--reasoning", "off"]
role = "default"

# Metadata supplied by Claude's verified probe; do not download at runtime.
# Google's card google/gemma-4-E4B-it at
# 4ecc2ba63bcac23ba4a767fc87025b1450f84c9c: apache-2.0, not gated.
# Q4_0 versus Qwen Q4_K_M is a known quantization confound: ggml-org has
# no official Q4_K_M. Text-only inference needs no mmproj file.
[[extractor.candidates]]
id = "gemma-4-e4b-it-q4_0"
repo = "ggml-org/gemma-4-E4B-it-GGUF"
revision = "8903cb408c7df39cde2ed15fac397e6d7be92951"
gguf_filename = "gemma-4-E4B-it-Q4_0.gguf"
sha256 = "a555b900214b477d8880e7832e0b8925e139b0159640036b09fe472b6f2097f2"
bytes = 4590807392
license = "Apache-2.0"
quantization = "Q4_0"
# Claude's hc-01 probe confirmed zero reasoning with this additional flag.
# Qwen retains its own tested flags; chat-template behavior is model-specific.
runtime_flags = ["--reasoning", "off", "--reasoning-budget", "0"]
role = "comparator"

# ---------------------------------------------------------------------------
# JVM for the official HL7 FHIR validator (PLAN A6).
# ---------------------------------------------------------------------------

[jvm]
