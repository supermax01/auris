# ---------------------------------------------------------------------------
# Speech-to-text, laptop profile.
# Source is OpenAI's original; Auris converts it to CTranslate2 INT8
# itself (`auris setup asr --fetch`). Revision, licence and file pins from
# the Hugging Face API, read 2026-11-12 / 2026-11-13:
#   https://huggingface.co/api/models/openai/whisper-large-v3-turbo/revision/<sha>?blobs=true
# (`siblings[].lfs.sha256` for the weights, `siblings[].blobId` for the
# rest). The conversion is deterministic: two conversions with
# CTranslate2 4.9.0 gave byte-identical files, pinned below.
# ---------------------------------------------------------------------------

[asr.laptop]
source_model = "openai/whisper-large-v3-turbo"
revision = "41f01f3fe87f28c78e2fbf8b568835947dd65ed9"
license = "MIT"
source_files = [
  { name = "added_tokens.json", bytes = 34648, git_blob_sha1 = "1b33526d33aaa60d79f78ae8651dae50b730185a" },
  { name = "config.json", bytes = 1256, git_blob_sha1 = "ad2f44ff1ed66e12765b2392dc041469db91a462" },
  { name = "generation_config.json", bytes = 3772, git_blob_sha1 = "cbe752958dc3e4671b0e0220aa1c545423a6d5f5" },
  { name = "merges.txt", bytes = 493869, git_blob_sha1 = "6038932a2a1f09a66991b1c2adae0d14066fa29e" },
  { name = "model.safetensors", bytes = 1617824864, sha256 = "542566a422ae4f3fd23f1ba11add198fca01bbf82e66e6a2857b3f608b1eb9d1" },
  { name = "normalizer.json", bytes = 52666, git_blob_sha1 = "dd6ae819ad738ac1a546e9f9282ef325c33b9ea0" },
  { name = "preprocessor_config.json", bytes = 340, git_blob_sha1 = "931c77a740890c46365c7ae0c9d350ba3cca908f" },
  { name = "special_tokens_map.json", bytes = 2186, git_blob_sha1 = "312bc106291bb51bf2cc1648df070bef963a0639" },
  { name = "tokenizer.json", bytes = 2710337, git_blob_sha1 = "17456db595adc78a973f97d69d8cb50bc87c0b1c" },
  { name = "tokenizer_config.json", bytes = 282843, git_blob_sha1 = "06ffdc8308eae6bb7bd1fdd81e94b0a881a539ab" },
  { name = "vocab.json", bytes = 1036558, git_blob_sha1 = "0f3456460629e21d559c6daa23ab6ce3644e8271" },
]

[asr.laptop.conversion]
tool = "ctranslate2"
tool_version = "4.9.0"
quantization = "int8"
copy_files = ["tokenizer.json", "preprocessor_config.json"]
files = [
  { name = "config.json", sha256 = "b0253ea6c0d3bea6b1e19e91a02acfd3b53f4467362efcb5a3e6b16c9b3a9b7e" },
  { name = "model.bin", sha256 = "7482f978f9493b93b3d0bf68a148a1a62ca02547e8ee981358ff8ef2de8a9418" },
  { name = "preprocessor_config.json", sha256 = "7ccc62c6f2765af1f3b46c00c9b5894426835a05021c8b9c01eecb6dfb542711" },
  { name = "tokenizer.json", sha256 = "297b13372ac43916285644fb9687add3cc62ee2a1adb60da3dc25cc94c1871fd" },
  { name = "vocabulary.json", sha256 = "c69260f2ab26d659b7c398f9a2b2b48ed0df16c3b47d7326782fd9cba71690c1" },
]

# Deterministic decoding (temperature 0, beam 5, Silero VAD from
# faster-whisper, no conditioning on earlier text to avoid loops).
[asr.decoding]
language = "en"
beam_size = 5
temperature = 0.0
condition_on_previous_text = false
vad_filter = true
word_timestamps = true
# Style only: without it Whisper often drops punctuation. It must say nothing
# clinical (enforced).
initial_prompt = "Hello, how are you? Fine, thanks. Shall we start?"
# The same sentence for every 30-second window; off by default.
style_every_window = false

# A speaker's consecutive pieces joined into turns (auris.speech.turns): no one
# else speaking between them, a pause of at most gap_seconds, a turn of at most
# max_seconds. Off by default.
[asr.segmentation]
join_turns = false
gap_seconds = 1.5
max_seconds = 60

# Drug-name hints (faster-whisper hotwords). Off by default. The words are the most-filled US outpatient prescriptions,
# 2024, from AHRQ MEPS HC-254A (public domain; names from Multum Lexicon),
# reduced to spoken ingredient names, in rank order, until 223 Whisper tokens
# (data/asr-hints/: SOURCE.md, top_drugs.tsv, build_hints.py).
[asr.hints]
enabled = false
source = "AHRQ MEPS HC-254A 2024 prescribed medicines, top fills (data/asr-hints)"
words = [
    "atorvastatin",
    "metformin",
    "levothyroxine",
    "amlodipine",
    "lisinopril",
    "albuterol",
    "losartan",
    "metoprolol",
    "rosuvastatin",
    "omeprazole",
    "gabapentin",
    "sertraline",
    "escitalopram",
    "semaglutide",
    "amphetamine",
    "dextroamphetamine",
    "pantoprazole",
    "bupropion",
    "hydrochlorothiazide",
    "fluoxetine",
    "trazodone",
    "montelukast",
    "amoxicillin",
    "tamsulosin",
    "apixaban",
    "insulin glargine",
    "simvastatin",
    "empagliflozin",
    "furosemide",
    "meloxicam",
    "acetaminophen",
    "hydrocodone",
    "tirzepatide",
    "fluticasone",
    "methylphenidate",
    "duloxetine",
    "prednisone",
    "carvedilol",
    "famotidine",
    "ibuprofen",
    "buspirone",
    "venlafaxine",
    "tramadol",
    "allopurinol",
]

# Drug-name spelling (auris.speech.spelling):
# a misheard drug name that is not English becomes the one RxNorm ingredient
# it sounds like; the heard text is kept. Off until measured. English word
# list: Webster's Second International (1934, copyright lapsed; public
# domain) as kept by FreeBSD, commit 4a65e12dfbaba7193e37fcd2e14fbc20776a78b9.
[asr.spelling]
enabled = false

[asr.spelling.word_list]
url = "https://raw.githubusercontent.com/freebsd/freebsd-src/4a65e12dfbaba7193e37fcd2e14fbc20776a78b9/share/dict/web2"
sha256 = "92165d95d72a67377e80052b1b9c3d63a4ac402ccd71690c89d949e809738238"
bytes = 2494065
license = "Public domain (Webster's Second International, 1934; copyright lapsed)"

# "Who spoke when": SpeechBrain ECAPA speaker embeddings.
# Only the embedding weights are used, loaded with weights_only (no pickled
# code, no HyperPyYAML). Pins from
#   https://huggingface.co/api/models/speechbrain/spkrec-ecapa-voxceleb?blobs=true
# read 2026-11-13 (`cardData.license` = "apache-2.0").
[asr.speaker_embedding]
source_model = "speechbrain/spkrec-ecapa-voxceleb"
revision = "0f99f2d0ebe89ac095bcc5903c4dd8f72b367286"
license = "Apache-2.0"
file = { name = "embedding_model.ckpt", bytes = 83316686, sha256 = "0575cb64845e6b9a10db9bcb74d5ac32b326b8dc90352671d345e2ee3d0126a2" }

# ---------------------------------------------------------------------------
# Fact-extraction model. Metadata only — weights are downloaded by
# `auris setup model`. Revision is field `sha` and the file digest is
# `siblings[].lfs.sha256` for the Q4_K_M file, from:
#   https://huggingface.co/api/models/Qwen/Qwen3-8B-GGUF?blobs=true
# read 2026-11-12. `cardData.license` = "apache-2.0".
# Temperature 0 (greedy decoding).
# ---------------------------------------------------------------------------

[extractor]
extraction_profile = "full-v0"
model = "Qwen/Qwen3-8B-GGUF"
revision = "7c41481f57cb95916b40956ab2f0b139b296d974"
gguf_filename = "Qwen3-8B-Q4_K_M.gguf"
gguf_sha256 = "d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785"
license = "Apache-2.0"
n_ctx = 8192
max_output_tokens = 4096
min_output_tokens = 1024
thinking = false
temperature = 0.0
temperature_status = "greedy baseline"

[extractor.loop_guard]
version = "loop-guard-v1"
identical_assertion_limit = 4

# Each call reserves measured input + 256 headroom, up to the output ceiling.
# Windows also shrink to fit the conservative output estimate.
# Truncated output is discarded before deterministic splitting; a truncated
# single segment fails the entire run.
[[extractor.candidates]]
id = "qwen3-8b-q4_k_m"
repo = "Qwen/Qwen3-8B-GGUF"
revision = "7c41481f57cb95916b40956ab2f0b139b296d974"
gguf_filename = "Qwen3-8B-Q4_K_M.gguf"
sha256 = "d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785"
license = "Apache-2.0"
quantization = "Q4_K_M"
runtime_flags = ["--reasoning", "off"]
role = "default"

# Metadata supplied by Claude's verified probe; do not download at runtime.
# Google's card google/gemma-4-E4B-it at
# 4ecc2ba63bcac23ba4a767fc87025b1450f84c9c: apache-2.0, not gated.
# Q4_0 versus Qwen Q4_K_M is a known quantization confound: ggml-org has
# no official Q4_K_M. Text-only inference needs no mmproj file.
# A-priori model-card settings; not chosen from Auris development results.
[extractor.candidates.card_sampling]
source_repo = "Qwen/Qwen3-8B-GGUF"
revision = "7c41481f57cb95916b40956ab2f0b139b296d974"
readme_sha256 = "913fd918b4afb4511accca0874f701248b024013e804fa7a463639ead74e4dcb"
mode = "non-thinking"
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5



