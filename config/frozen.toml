# Auris frozen reference configuration (PLAN Appendix A6).
#
# Every value here is pinned. Changing a value means re-auditing the
# artefact it names (source, licence, checksum) — see PLAN A8/A11.
# Loaded and validated by src/auris/config.py.

# ---------------------------------------------------------------------------
# FHIR R4 4.0.1 + US Core 6.1.0 (PLAN A2/A6)
#
# Package SHA-256 values were computed locally from the tarballs downloaded
# from the official FHIR package registry on 2026-11-12, e.g.
#   https://packages.fhir.org/hl7.fhir.r4.core/4.0.1
#   https://packages.fhir.org/hl7.fhir.us.core/6.1.0
# (fallback registry base: https://packages2.fhir.org/packages).
# The registry does not publish SHA-256 digests, so the first download is
# the trust anchor; `auris setup fhir` refuses any later mismatch.
# Licence values are the `license` field of each package's package.json,
# read from the downloaded tarballs on the same date.
# ---------------------------------------------------------------------------

[fhir]
version = "4.0.1"
us_core_package_id = "hl7.fhir.us.core"
