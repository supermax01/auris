# Element sources for the Auris FHIR contract (hand-maintained).
#
# For every required (min >= 1) or fixed/pattern element in
# src/auris/contract/checklist.json, where its value comes from:
#   extracted     - stated in the visit; pulled by the extractor and
#                   coded by the terminology mapper where A3 says so
#   intake        - supplied by the A1 intake contract, never extracted
#   fixed         - fixed/pattern value from the profile, or the
#                   mapper's code table for that profile
#   mapper-policy - an Auris policy value from the A3 matrix
#                   (e.g. status=preliminary, intent=proposal)
#   not-emitted   - never written in v1 (note says why)
#   unresolved    - PLAN does not decide; must also appear in
#                   [open_questions] with a reason
#
# A few additional Must Support elements whose source A3 fixes are also
# included (e.g. MedicationRequest.requester); the coverage test
# enforces only the required/fixed entries.
# Sources are taken from PLAN A1/A3 and docs/fhir-reference.md only.

[profiles.us-core-vital-signs.elements]
# Base profile: Auris claims a specific vital-signs profile per reading.
"Observation.status" = { source = "mapper-policy", note = "preliminary (A3); profiles do not narrow ObservationStatus" }
"Observation.category" = { source = "fixed", note = "mapper injects the VSCat slice (A2/A3)" }
"Observation.category:VSCat" = { source = "fixed", note = "mapper injects the VSCat slice (A2/A3)" }
"Observation.category:VSCat.coding" = { source = "fixed", note = "single coding written by the mapper" }
"Observation.category:VSCat.coding.system" = { source = "fixed", note = "fixed by profile" }
"Observation.category:VSCat.coding.code" = { source = "fixed", note = "fixed vital-signs by profile" }
"Observation.code" = { source = "fixed", note = "mapper code table: the LOINC of the specific vital-signs profile claimed (A3)" }
"Observation.subject" = { source = "intake", note = "reference to the intake Patient (A1/A2)" }
"Observation.effective[x]" = { source = "mapper-policy", note = "in-visit measurement inherits Encounter.period.start; a reported or historical reading uses the spoken date at day precision (A3, vs-1)" }
"Observation.component.code" = { source = "not-emitted", note = "no components under the base profile itself; components appear only via the specific blood-pressure and pulse-oximetry profiles" }

