[[open_questions]]
profile = "us-core-pulse-oximetry"
element = "Observation.component:FlowRate.value[x].value"
reason = "PLAN A3 covers a vital sign as value+unit and never mentions the pulse-oximetry FlowRate/Concentration components. Whether a spoken oxygen flow rate (e.g. 'on two litres') is extracted into this component in v1, or left in the ledger, is undecided."

[[open_questions]]
profile = "us-core-pulse-oximetry"
element = "Observation.component:Concentration.value[x].value"
reason = "Same question as FlowRate: whether a spoken inhaled oxygen concentration becomes this component in v1 is undecided in PLAN."

[[open_questions]]
profile = "us-core-encounter"
element = "Encounter.diagnosis.condition"
reason = "A1 supplies the Encounter and fhir-reference says a Condition always references the intake Encounter (Condition.encounter). Nothing states whether Auris also writes Encounter.diagnosis entries pointing at extracted Conditions, which would mean modifying an intake-supplied resource."
